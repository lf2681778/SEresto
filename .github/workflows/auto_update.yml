name: Daily Auto Open
on:
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: 安裝讀取 Excel 的套件
        run: npm install xlsx
        
      - name: 執行自動更新腳本
        id: run_script
        env:
          # 🌟 注意！這裡改為抓取 USERNAME 和 PASSWORD，請務必在 GitHub Secrets 新增！
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          CHAIN_ID: ${{ secrets.CHAIN_ID }}
          PLATFORM_KEY: "FP_TW" # 根據截圖設定
        run: node main.js
        
      # === 當腳本亮紅燈 (超過容忍值) 時觸發 ===
      - name: 傳送 Discord 通知 (❌ 超過容忍值)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content": "🚨 **711Food排程結果 (異常)**\n✅ 成功：`${{ steps.run_script.outputs.success_count }}` 筆\n❌ 失敗：`${{ steps.run_script.outputs.error_count }}` 筆\n目前失敗數量已超過容忍值，請盡速上 GitHub 檢查！"}' \
          ${{ secrets.DISCORD_WEBHOOK }}

      # === 當腳本亮綠燈 (在容忍值以內) 時觸發 ===
      - name: 傳送 Discord 通知 (✅ 安全範圍內)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content": "🟢 **711Food排程結果 (正常)**\n✅ 成功：`${{ steps.run_script.outputs.success_count }}` 筆\n❌ 失敗：`${{ steps.run_script.outputs.error_count }}` 筆\n失敗數量在容忍範圍內，系統平安無事！"}' \
          ${{ secrets.DISCORD_WEBHOOK }}
